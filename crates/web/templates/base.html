<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      body {
        max-width: 48rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      header nav {
        display: flex;
        gap: 1rem;
        font-size: 0.9rem;
      }
      footer {
        margin-top: 4rem;
        font-size: 0.85rem;
        opacity: 0.65;
      }
      code {
        background: rgba(127, 127, 127, 0.15);
        padding: 0.1rem 0.3rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>{{ title }}</h1>
      <nav>
        <a href="/">Accueil</a>
        <a href="/health">Health</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      einvoice-rs v{{ version }}
    </footer>
  </body>
</html>
